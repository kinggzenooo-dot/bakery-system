<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Immediate redirect if not logged in
    (function() {
      try {
        var user = localStorage.getItem('fb_user');
        if (!user) {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fredy Bills — Artisan Bakery</title>
  <meta name="description" content="Freshly baked artisan cakes, sourdough breads, croissants, and Filipino confections. Order online for delivery or pickup from Fredy Bills Bakery, Cebu City.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="app"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script>
    // =============================================
    // EARLY ROLE GUARD — redirect staff to their
    // dedicated pages before loading heavy JS
    // =============================================
    (function() {
      const ROLE_PAGES = {
        'Counter Staff':  'pos.html',
        'Baker':          'baker.html',
        'Delivery Staff': 'delivery.html',
        'Administrator':  'admin.html'
      };
      try {
        const stored = localStorage.getItem('fb_user');
        if (!stored) { window.location.href = 'login.html'; return; }
        const user = JSON.parse(stored);
        if (!user || !user.role) { window.location.href = 'login.html'; return; }
        const redirect = ROLE_PAGES[user.role];
        if (redirect) { window.location.href = redirect; return; }
        // Customer role — continue loading the storefront SPA
      } catch (e) {
        window.location.href = 'login.html';
      }
    })();
  </script>

  <!-- Only loaded if Customer role (SPA storefront) -->
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
