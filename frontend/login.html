<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fredy Bills — System Authorization & Role Portal</title>
  <meta name="description" content="Sign in or register for Fredy Bills Bakery Management System. Select your role to access your dedicated portal.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    @media (max-width: 700px) {
      .auth-two-col { grid-template-columns: 1fr !important; }
      .auth-left-panel { display: none; }
    }
  </style>
</head>
<body>

  <div id="auth-app"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script>

    // =============================================
    // ROLE → PAGE ROUTING MAP
    // =============================================
    const ROLE_PAGES = {
      'Customer':       'index.html',
      'Counter Staff':  'pos.html',
      'Baker':          'baker.html',
      'Delivery Staff': 'delivery.html',
      'Administrator':  'admin.html'
    };

    function redirectForRole(role) {
      const page = ROLE_PAGES[role] || 'index.html';
      window.location.href = page;
    }

    // =============================================
    // LOGIN PAGE SCRIPT
    // =============================================
    document.addEventListener('DOMContentLoaded', () => {
      // Apply saved theme
      const savedTheme = localStorage.getItem('fb_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // If already logged in, redirect to their portal immediately
      try {
        const stored = localStorage.getItem('fb_user');
        if (stored) {
          const user = JSON.parse(stored);
          if (user && user.role) {
            redirectForRole(user.role);
            return;
          }
        }
      } catch (e) {}

      let currentTab = 'login';
      let selectedRole = 'Customer';

      const render = () => {
        const container = document.getElementById('auth-app');
        if (!container) return;

        const roles = BAKERY_DATA.roles;
        const isLogin = currentTab === 'login';

        container.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:3rem 1.5rem;background-color:var(--c-dark);overflow:hidden;">

            <!-- Background -->
            <div style="position:absolute;inset:0;z-index:1;">
              <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1600&q=80" alt="Bakery" style="width:100%;height:100%;object-fit:cover;filter:brightness(0.22);">
              <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,10,7,0.7) 0%,rgba(15,10,7,0.5) 100%);"></div>
            </div>

            <!-- Theme Toggle Button -->
            <button onclick="toggleLoginTheme();" style="position:absolute;top:1.5rem;right:1.5rem;z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;" title="Toggle Theme" id="theme-btn">
              ${Icons.sun()}
            </button>

            <div class="auth-two-col" style="position:relative;z-index:2;max-width:960px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;">

              <!-- LEFT: Brand & Portal Directory -->
              <div class="auth-left-panel" style="color:var(--c-cream);">
                <div style="font-size:0.78rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--c-accent-bright);margin-bottom:1rem;">
                  Fredy Bills Baker Management System
                </div>
                <h1 style="font-family:var(--f-serif);font-size:clamp(2.4rem, 5vw, 3.6rem);font-weight:700;line-height:1.1;margin-bottom:1.25rem;">
                  System<br><em style="font-style:italic;color:var(--c-accent-bright);">Authorization.</em>
                </h1>
                <p style="font-size:0.92rem;color:var(--c-muted-light);line-height:1.75;margin-bottom:2rem;">
                  Log in with your credentials and select your role. You will be automatically directed to your dedicated portal page.
                </p>

                <!-- 1-Click Quick Demo -->
                <div style="background:rgba(15,10,7,0.82);backdrop-filter:blur(12px);border:1px solid var(--c-border);padding:1.25rem;margin-bottom:1.5rem;">
                  <p style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--c-accent-bright);margin-bottom:0.75rem;">
                    1-Click Quick Demo Sign In:
                  </p>
                  <div style="display:flex;flex-wrap:wrap;gap:0.4rem;">
                    ${roles.map(r => `
                      <button class="demo-role-btn" onclick="quickLogin('${r}');">${r}</button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- RIGHT: Auth Form Card -->
              <div style="background:var(--c-dark-surface);border:1px solid var(--c-border);padding:2.5rem 2rem;box-shadow:0 24px 60px rgba(0,0,0,0.65);">

                <div style="text-align:center;margin-bottom:1.75rem;">
                  <span style="font-family:var(--f-serif);font-size:1.9rem;font-weight:700;color:var(--c-cream);">
                    Fredy Bills<span style="color:var(--c-accent);">.</span>
                  </span>
                  <p style="font-size:0.82rem;color:var(--c-muted);margin-top:0.3rem;">
                    Bakery Management System — Secure Login
                  </p>
                </div>

                <!-- TABS -->
                <div class="auth-tabs">
                  <div class="auth-tab ${isLogin ? 'active' : ''}" id="tab-login-btn">Log In</div>
                  <div class="auth-tab ${!isLogin ? 'active' : ''}" id="tab-register-btn">Register</div>
                </div>

                ${isLogin ? `
                  <!-- LOGIN FORM -->
                  <form id="login-form" autocomplete="on">
                    <div class="form-grp">
                      <label>Email Address</label>
                      <input type="email" id="login-email" required autocomplete="email" value="customer@fredybills.ph" class="form-input" placeholder="user@fredybills.ph">
                    </div>
                    <div class="form-grp">
                      <label>Password</label>
                      <div style="position:relative;">
                        <input type="password" id="login-pass" required autocomplete="current-password" value="password123" class="form-input" placeholder="••••••••" style="padding-right:2.5rem;">
                        <button type="button" onclick="togglePassVis('login-pass', this);" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);color:var(--c-muted);">${Icons.eye()}</button>
                      </div>
                    </div>

                    <div class="form-grp">
                      <label>Select Active Role</label>
                      <select id="login-role" class="form-input">
                        ${roles.map(r => `<option value="${r}">${r}</option>`).join('')}
                      </select>
                      <div id="role-destination" style="font-size:0.72rem;color:var(--c-accent-bright);margin-top:0.3rem;font-weight:600;"></div>
                    </div>

                    <div id="login-error" style="display:none;padding:0.65rem 0.85rem;background:rgba(196,91,63,0.15);border:1px solid rgba(196,91,63,0.4);color:var(--c-red);font-size:0.82rem;margin-bottom:0.75rem;border-radius:2px;"></div>

                    <button type="submit" class="btn btn-fill" id="login-submit-btn" style="width:100%;margin-top:1rem;">
                      Log In &amp; Go to My Portal ${Icons.arrowRight()}
                    </button>
                  </form>
                ` : `
                  <!-- REGISTER FORM -->
                  <form id="register-form">
                    <div class="form-grp">
                      <label>Full Name *</label>
                      <input type="text" id="reg-name" required placeholder="e.g. Maria Santos" class="form-input">
                    </div>
                    <div class="form-grp">
                      <label>Email Address *</label>
                      <input type="email" id="reg-email" required placeholder="user@example.ph" class="form-input">
                    </div>
                    <div class="form-grp">
                      <label>Password *</label>
                      <input type="password" id="reg-pass" required placeholder="••••••••" class="form-input">
                    </div>

                    <div class="form-grp">
                      <label>Select Your Role *</label>
                      <div class="role-select-grid">
                        ${roles.map(r => `
                          <div class="role-opt-card ${selectedRole === r ? 'active' : ''}" onclick="setRole('${r}');">
                            <div class="role-opt-title">${r}</div>
                            <div class="role-opt-desc">${getRoleDesc(r)}</div>
                          </div>
                        `).join('')}
                      </div>
                    </div>

                    <div id="reg-error" style="display:none;padding:0.65rem 0.85rem;background:rgba(196,91,63,0.15);border:1px solid rgba(196,91,63,0.4);color:var(--c-red);font-size:0.82rem;margin-bottom:0.75rem;border-radius:2px;"></div>

                    <button type="submit" class="btn btn-fill" id="reg-submit-btn" style="width:100%;margin-top:1rem;">
                      Create Account &amp; Enter Portal ${Icons.arrowRight()}
                    </button>
                  </form>
                `}

              </div>
            </div>
          </div>
        `;

        // ---- Bind Tab Switches ----
        document.getElementById('tab-login-btn')?.addEventListener('click', () => { currentTab = 'login'; render(); });
        document.getElementById('tab-register-btn')?.addEventListener('click', () => { currentTab = 'signup'; render(); });

        // ---- Role Destination Preview ----
        const roleSelect = document.getElementById('login-role');
        if (roleSelect) {
          const updateDestination = () => {
            const dest = document.getElementById('role-destination');
            if (dest) dest.textContent = `→ Will open: ${ROLE_PAGES[roleSelect.value] || 'index.html'}`;
          };
          roleSelect.addEventListener('change', updateDestination);
          updateDestination();
        }

        // ---- Login Form Submit ----
        document.getElementById('login-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim();
          const pass = document.getElementById('login-pass').value;
          const role = document.getElementById('login-role').value;
          const btn = document.getElementById('login-submit-btn');
          const errBox = document.getElementById('login-error');

          if (btn) { btn.disabled = true; btn.innerHTML = 'Signing in...'; }
          if (errBox) errBox.style.display = 'none';

          try {
            await API.login({ email, password: pass, role });
          } catch (err) {
            // Graceful fallback for offline / no backend
            const mock = BAKERY_DATA.mockAccounts.find(a => a.email.toLowerCase() === email.toLowerCase());
            if (mock) {
              mock.role = role;
              localStorage.setItem('fb_user', JSON.stringify(mock));
            } else {
              // New user not in seed data — create a session locally
              const fallback = { name: email.split('@')[0], email, role, phone: '', address: '' };
              localStorage.setItem('fb_user', JSON.stringify(fallback));
            }
          }

          // Verify stored user exists then redirect
          const stored = localStorage.getItem('fb_user');
          if (stored) {
            redirectForRole(role);
          } else {
            if (errBox) { errBox.textContent = 'Login failed. Please check your credentials.'; errBox.style.display = 'block'; }
            if (btn) { btn.disabled = false; btn.innerHTML = `Log In &amp; Go to My Portal ${Icons.arrowRight()}`; }
          }
        });

        // ---- Register Form Submit ----
        document.getElementById('register-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('reg-name').value.trim();
          const email = document.getElementById('reg-email').value.trim();
          const pass = document.getElementById('reg-pass').value;
          const btn = document.getElementById('reg-submit-btn');
          const errBox = document.getElementById('reg-error');

          if (!name || !email || !pass) {
            if (errBox) { errBox.textContent = 'Please fill in all required fields.'; errBox.style.display = 'block'; }
            return;
          }

          if (btn) { btn.disabled = true; btn.innerHTML = 'Creating account...'; }
          if (errBox) errBox.style.display = 'none';

          try {
            await API.register({ name, email, password: pass, role: selectedRole, phone: '', address: '' });
          } catch (err) {
            // Offline fallback
            const newUser = { name, email, role: selectedRole, phone: '', address: '' };
            localStorage.setItem('fb_user', JSON.stringify(newUser));
          }

          const stored = localStorage.getItem('fb_user');
          if (stored) {
            redirectForRole(selectedRole);
          } else {
            if (errBox) { errBox.textContent = 'Registration failed. Please try again.'; errBox.style.display = 'block'; }
            if (btn) { btn.disabled = false; btn.innerHTML = `Create Account &amp; Enter Portal ${Icons.arrowRight()}`; }
          }
        });
      };

      // ---- Helpers ----
      window.setRole = (r) => { selectedRole = r; render(); };

      window.getRoleDesc = (r) => {
        const descs = {
          'Customer': 'Online storefront',
          'Counter Staff': 'POS terminal',
          'Baker': 'Kitchen display',
          'Delivery Staff': 'Courier app',
          'Administrator': 'Full management'
        };
        return descs[r] || '';
      };

      window.togglePassVis = (inputId, btn) => {
        const inp = document.getElementById(inputId);
        if (!inp) return;
        inp.type = inp.type === 'password' ? 'text' : 'password';
      };

      window.toggleLoginTheme = () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fb_theme', next);
        render();
      };

      window.quickLogin = async (roleName) => {
        const mock = BAKERY_DATA.mockAccounts.find(a => a.role === roleName) || {
          name: `${roleName} User`,
          email: `${roleName.toLowerCase().replace(/\s+/g, '')}@fredybills.ph`,
          role: roleName,
          phone: '+63 917 000 0000',
          address: 'Cebu City'
        };

        try {
          await API.login({ email: mock.email, password: 'password123', role: roleName });
        } catch (err) {
          localStorage.setItem('fb_user', JSON.stringify(mock));
        }

        redirectForRole(roleName);
      };

      render();
    });
  </script>
</body>
</html>
