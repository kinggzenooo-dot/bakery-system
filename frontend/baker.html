<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fredy Bills — Baker Kitchen Display System (KDS)</title>
  <meta name="description" content="Fredy Bills Bakery Baker Kitchen Display System. Manage production batches, track baking progress, confirm ingredient usage.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="baker-root"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>

  <script>
    // =============================================
    // BAKER KITCHEN DISPLAY SYSTEM — Standalone Page
    // =============================================
    document.addEventListener('DOMContentLoaded', async () => {

      const savedTheme = localStorage.getItem('fb_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      let currentUser = null;
      try {
        const stored = localStorage.getItem('fb_user');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) {}

      if (!currentUser) { window.location.href = 'login.html'; return; }
      if (currentUser.role !== 'Baker') {
        alert(`Access Denied. This portal is for Bakers only.\nYou are logged in as: ${currentUser.role}`);
        window.location.href = 'login.html';
        return;
      }

      document.title = `Kitchen Display — ${currentUser.name} | Fredy Bills`;
      renderBakerPortal(currentUser);
    });

    async function renderBakerPortal(user) {
      const root = document.getElementById('baker-root');

      const state = {
        currentUser: user,
        theme: localStorage.getItem('fb_theme') || 'dark',
        productionTasks: [],
        bakerFilterStatus: 'All',
        bakerActiveTask: null,
        toasts: []
      };

      window.store = {
        state,
        notify() { render(); },
        toggleTheme() {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', state.theme);
          localStorage.setItem('fb_theme', state.theme);
          this.showToast(`Switched to ${state.theme === 'dark' ? 'Dark' : 'Light'} Mode`);
          this.notify();
        },
        logoutUser() {
          localStorage.removeItem('fb_user');
          localStorage.removeItem('fb_token');
          window.location.href = 'login.html';
        },
        async syncBakerData() {
          try {
            const tasks = await API.getProductionTasks().catch(() => []);
            if (tasks) state.productionTasks = tasks;
            this.notify();
          } catch (e) { console.warn('[Baker] Sync error:', e); }
        },
        async advanceBakerTask(taskId, nextStatus, notes) {
          try {
            const updated = await API.updateProductionStatus(taskId, nextStatus, null, notes || '');
            const idx = state.productionTasks.findIndex(t => t.id === taskId);
            if (idx > -1) state.productionTasks[idx] = updated;
            this.showToast(`Batch #${updated.task_code} → ${nextStatus}`);
            this.syncBakerData();
          } catch (e) { this.showToast(`Error: ${e.message}`, 'error'); }
        },
        showToast(message, type = 'success') {
          const id = Date.now();
          state.toasts.push({ id, message, type });
          this.notify();
          setTimeout(() => { state.toasts = state.toasts.filter(t => t.id !== id); this.notify(); }, 4000);
        }
      };

      // Auto-refresh every 60 seconds (live KDS)
      setInterval(() => store.syncBakerData(), 60000);

      function render() {
        if (typeof C === 'undefined') return;
        root.innerHTML = `
          ${C.BakerApp(state)}
          ${C.Toasts(state)}
        `;
      }

      const script = document.createElement('script');
      script.src = 'js/components.js';
      script.onload = () => {
        store.syncBakerData();
        render();
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
